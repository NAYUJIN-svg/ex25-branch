spring.application.name=ex25-branch
server.port=8020


spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/testdb
spring.datasource.username=root
spring.datasource.password=1234


#mybatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.nyg.mybatis.domain
mybatis.configuration.map-underscore-to-camel-case=true



logging.level.com.skc.mybatis.mapper=DEBUG


server.servlet.encoding.charset=UTF-8
#�server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true



logging.file.name=logs/app.log

logging.level.root=info
logging.level.com.nyg.mybatis.service=debug
logging.level.com.nyg=debug


#mybatis.mapper-locations=classpath:mapper/*.xml
#mybatis.type-aliases-package=com.nyg.mybatis.domain
#mybatis.configuration.map-underscore-to-camel-case=true
# MyBatis 설정_SQL 출력
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl


# spring 로깅설정 : 로그 레벨
logging.level.com.nyg.mybatis.mapper=debug



